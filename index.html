<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScaleX | Insights &amp; Blogs</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="ScaleX">
      <i class="ri-shapes-fill brand-icon" aria-hidden="true"></i>
      <span>ScaleX</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">About Us</a>
      <a href="#">Blogs</a>
      <a href="#">Contact Us</a>
    </nav>

    <a class="get-started" href="#">Get Started</a>
  </header>

  <main class="page-content">
    <h1>Insights &amp; Blogs</h1>

    <div class="category-filters" aria-label="Blog categories">
      <span class="filter active">All</span>
      <span class="filter">Tech</span>
      <span class="filter">SaaS</span>
      <span class="filter">Marketing</span>
    </div>

    <section class="blog-grid" aria-label="Blog posts">
      <article class="blog-card">
        <img class="blog-image" src="blog2.jpeg" alt="Martini glass against a vivid red tiled wall">
        <div class="card-content">
          <span class="category">Tech</span>
          <h2>The Ultimate Guide To<br class="desktop-break"> SaaS Marketing</h2>
          <p class="date">May 23, 2025</p>
        </div>
      </article>

      <article class="blog-card">
        <img class="blog-image" src="chair.jpeg" alt="Dark green chair in a vivid red and orange room">
        <div class="card-content">
          <span class="category">SaaS</span>
          <h2>5 Key Trends In SaaS<br class="desktop-break"> Growth For 2025</h2>
          <p class="date">May 23, 2025</p>
        </div>
      </article>

      <article class="blog-card">
        <img class="blog-image" src="cat.jpeg" alt="Orange cat looking upward against a red background">
        <div class="card-content">
          <span class="category">Marketing</span>
          <h2>How Data-Driven<br class="desktop-break"> Strategies Are Important</h2>
          <p class="date">May 23, 2025</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
